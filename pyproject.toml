[project]
name = "ai-email-personal-assistant"
version = "0.1.0"
description = "AI assistant that captures email in real time and proposes next steps, with a human approval step"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "nylas>=6.18.0",
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
